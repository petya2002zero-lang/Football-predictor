name: Daily Sports Data Update

on:
  schedule:
    - cron: '0 7 * * *'    # 07:00 UTC = 08:00 CET (UTC+1) / 09:00 CEST (UTC+2)
  workflow_dispatch:
    inputs:
      retrain_models:
        description: 'Retrain ML models after data update?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Data Engine
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          # Validate database.sqlite before running — delete if corrupted
          python3 -c "
          import sqlite3, os
          db = 'database.sqlite'
          if os.path.exists(db):
              try:
                  c = sqlite3.connect(db)
                  c.execute('PRAGMA integrity_check')
                  c.close()
                  print('DB OK')
              except sqlite3.DatabaseError:
                  print('DB corrupted — removing.')
                  os.remove(db)
          "
          python train_master.py

      - name: Retrain ML Models
        if: github.event.inputs.retrain_models == 'true'
        run: python train_ml.py

      - name: Commit database
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull --rebase origin main || true
          git add -f database.sqlite
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "🤖 Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main

      - name: Commit retrained models
        if: github.event.inputs.retrain_models == 'true'
        run: |
          git pull --rebase origin main || true
          git add -f xgb_match_model.joblib xgb_o25_model.joblib meta_match_model.joblib lgb_match_model.joblib meta_scaler.joblib lgb_o25_model.joblib meta_o25_model.joblib meta_temperature.joblib
          git diff --cached --quiet && echo "No model changes" && exit 0
          git commit -m "🧠 Retrained models $(date -u '+%Y-%m-%d')"
          git push origin main

      - name: Export HF data
        run: python export_hf_data.py

      # Push a clean single-commit snapshot to HF — no history, LFS for large files
      - name: Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git + LFS credentials for HF
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git lfs install
          git config --global credential.helper store
          echo "https://P3tya:${HF_TOKEN}@huggingface.co" > ~/.git-credentials

          # Create worktree with orphan branch
          WORK=$(mktemp -d)
          git worktree add "$WORK" --detach
          cd "$WORK"
          git checkout --orphan hf-deploy
          git rm -rf . --quiet

          # Copy repo contents (exclude legacy pkl files)
          rsync -a --exclude='.git' --exclude='home_goals_model.pkl' \
                --exclude='away_goals_model.pkl' \
                "$GITHUB_WORKSPACE/" .

          # Set up LFS tracking for large files
          cat > .gitattributes << 'ATTRS'
          *.sqlite filter=lfs diff=lfs merge=lfs -text
          *.joblib filter=lfs diff=lfs merge=lfs -text
          *.pkl    filter=lfs diff=lfs merge=lfs -text
          ATTRS

          # Stage and commit (force-add gitignored files needed by HF)
          git add .
          git add -f hf_data.json *.joblib || true
          git commit -m "🚀 Deploy $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Push to HF with LFS
          git remote add hf https://P3tya:${HF_TOKEN}@huggingface.co/spaces/P3tya/FootballPredictor
          git push hf hf-deploy:main --force

          # Cleanup
          cd "$GITHUB_WORKSPACE"
          git worktree remove "$WORK" --force
          rm -f ~/.git-credentials
